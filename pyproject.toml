[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-craft"
version = "0.2.0"
description = "A production-oriented Transformer toolkit for code language modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
transformer-craft = "transformer_craft.cli:main"

[tool.setuptools.packages.find]
include = ["transformer_craft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
